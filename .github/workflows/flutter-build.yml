name: Build & Upload
on:
  workflow_dispatch:
  push:

jobs:
  build_androidApk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-java@main
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # 4. Cache Pub Dependencies
      # Speeds up 'flutter pub get' by storing the package cache
      - name: Cache Pub dependencies
        uses: actions/cache@main
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 5. Install Dependencies
      - run: flutter pub get

      # 6. Configure Keystore & Secrets
      # securely decodes the keystore and writes key.properties
      - name: Setup Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release APK."
            exit 1
          fi
          # Strip all whitespace so wrapping/newlines in the secret cannot corrupt the file
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > android/keystore.jks
          # Fail fast with a clear message if the decoded file is not a valid keystore
          keytool -list -keystore android/keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null || {
            echo "::error::Decoded keystore.jks is not a valid keystore (or KEYSTORE_PASSWORD is wrong). Check that KEYSTORE_BASE64 is the full base64 of the release keystore file."
            exit 1
          }
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ github.workspace }}/android/keystore.jks" >> android/key.properties
          echo "${{ secrets.SECRETS_ENVS_BASE64 }}" | base64 -d > lib/secrets.dart
      - name: Microg
        run: |
            gh release download --repo MorpheApp/MicroG-RE --pattern "*.apk" --dir build/app/*/*/*

      - name: Build APK
        run: flutter build apk --release --target-platform  android-arm64 --build-name "RDmanager v1.0.${{ github.run_number }}"
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/*/*/*.apk"
          allowUpdates: true
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "RDmanager v1.0.${{ github.run_number }}"

      # - name: ntfy-notifications
