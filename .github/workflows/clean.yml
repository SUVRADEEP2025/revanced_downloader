name: Clean Workflow Runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Number of days to keep runs (0 to delete all)'
        required: false
        default: '0'
        type: string
      keep_minimum_runs:
        description: 'Minimum number of runs to keep per workflow'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.retain_days || '0' }}
          keep_minimum_runs: ${{ inputs.keep_minimum_runs || '0' }}
      - uses: actions/checkout@main
      - uses: Nats-ji/delete-old-releases@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-count: 2
          keep-old-minor-releases: false
          keep-old-minor-releases-count: 1

      - name: Squash PR
        uses: robotology/gh-action-squash@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
