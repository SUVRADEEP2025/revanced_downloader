name: CI/CD Pipeline

on:
  push:

jobs:
  flutter_test:
    name: Run Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Run CI with mise
        env:
          SECRETS_ENVS_BASE64: ${{ secrets.ENVS }}
        run: mise run ci

      - name: ntfy-notifications
        uses: niniyas/ntfy-action@master
        with:
          url: ${{ secrets.NTFY_URL }}
          topic: uptest
          details: "Build #${{ github.run_number }}: ${{ job.status }} - v1.0.${{ github.run_number }}"
